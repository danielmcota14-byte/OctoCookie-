# OctoCookie — UM serviço no Render roda tudo (site + bot 24/7 + CookieScript).
# Render: New → Blueprint → conecte o repositório (este arquivo na RAIZ). Segredos são pedidos no painel.
services:
  - type: web
    name: octocookie
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: standard          # Chromium (bot) + Python + site precisam de RAM; 512 MB estoura
    healthCheckPath: /healthz
    disk:
      name: octo-data
      mountPath: /data      # cofre cifrado do bot; sem disco ele some a cada deploy
      sizeGB: 1
    envVars:
      - key: GROQ_API_KEYS
        sync: false         # até 5 chaves Groq separadas por vírgula (site, Finance, Start, IDE...)
      - key: GROQ_API_KEY
        sync: false         # 1 chave Groq para a "Cookie Potencializada" do CookieScript
      - key: OWNER_TOKEN
        sync: false         # mín. 24 caracteres; se vazio, usa o token de public/octocookie-app/bot-config.js
      - key: SERVER_MASTER_KEY
        sync: false         # opcional (openssl rand -base64 32)
      - key: RPC_URL_ETHEREUM
        sync: false         # seu RPC https (Alchemy/Infura)
      - key: ADMIN_UIDS
        sync: false
      - key: ADMIN_EMAILS
        value: danimcota@gmail.com
      - key: FIREBASE_PROJECT_ID
        value: octo-10d4f
      - key: ADSTERRA_TOKEN
        sync: false
      - key: ALLOWED_ORIGINS
        value: "*"
