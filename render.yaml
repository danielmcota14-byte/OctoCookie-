# Blueprint Render — site + Bot 24/7
# New → Blueprint → conecte o repositório (este arquivo na RAIZ).
services:
  # Bot 24/7 (Chromium headless + octocookie.html)
  - type: web
    name: octocookie-bot-24x7
    runtime: docker
    dockerfilePath: ./bot-server/Dockerfile
    dockerContext: .
    plan: standard
    healthCheckPath: /health
    disk:
      name: octo-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: OWNER_TOKEN
        sync: false
      - key: SERVER_MASTER_KEY
        sync: false
      - key: RPC_URL_ETHEREUM
        sync: false
      - key: ALLOWED_ORIGINS
        value: "https://octocookie.onrender.com"

  # Opcional: se o site principal também for deployado daqui (ajuste buildCommand/start conforme seu host).
  # O site atual em octocookie.onrender.com pode continuar no fluxo Lovable/Vite atual.
  # Depois do bot subir, copie a URL pública do serviço octocookie-bot-24x7 em:
  #   public/octocookie-app/bot-config.js  →  url: "https://...."
  #   e/ou variável de build VITE_BOT_24X7_URL=https://....
