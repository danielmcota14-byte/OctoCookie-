<!doctype html>
<html><head><meta charset="utf-8"><meta name="robots" content="noindex">
<style>
:root{--rh-bg:#eef2ec;--rh-surface:#f9fbf7;--rh-surface-2:#e3eae2;--rh-surface-3:#d7e1d6;--rh-ink:#16281f;--rh-ink-2:#2a3d33;--rh-muted:#3f5348;--rh-faint:#566b5e;
--rh-line:#cbd6cb;--rh-line-2:#a9bcae;--rh-brand:#2d6a4f;--rh-brand-soft:rgba(45,106,79,.13);--rh-accent:#9a5206;--rh-on-accent:#ffffff;--rh-accent-soft:#f3e2c4;
--rh-solid:#16281f;--rh-ok:#1f7a4d;--rh-warn:#8a5a00;--rh-err:#b42318;--rh-info:#1d5fa8;--rh-overlay:rgba(22,40,31,.5);--rh-shadow:0 10px 30px -18px rgba(22,40,31,.45);--rh-r:10px;--rh-r-lg:14px;--rh-tap:44px;--rh-ease:cubic-bezier(.2,.8,.2,1);
--rh-serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;--rh-sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--rh-mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--rh-bg:#0e1a15;--rh-surface:#15251e;--rh-surface-2:#1c3027;--rh-surface-3:#24392f;--rh-ink:#e9f1ea;--rh-ink-2:#d4e2d7;--rh-muted:#a9bbb0;--rh-faint:#8aa095;
--rh-line:#2b4036;--rh-line-2:#3d5a4b;--rh-brand:#6fcf9f;--rh-brand-soft:rgba(111,207,159,.15);--rh-accent:#f0b24a;--rh-on-accent:#1b2f26;--rh-accent-soft:#3a2c14;
--rh-solid:#24392f;--rh-ok:#4ade80;--rh-warn:#fbbf24;--rh-err:#f87171;--rh-info:#7cb6f0;--rh-overlay:rgba(0,0,0,.6);--rh-shadow:0 14px 34px -18px rgba(0,0,0,.8);color-scheme:dark}}
:root[data-theme="dark"]{--rh-bg:#0e1a15;--rh-surface:#15251e;--rh-surface-2:#1c3027;--rh-surface-3:#24392f;--rh-ink:#e9f1ea;--rh-ink-2:#d4e2d7;--rh-muted:#a9bbb0;--rh-faint:#8aa095;
--rh-line:#2b4036;--rh-line-2:#3d5a4b;--rh-brand:#6fcf9f;--rh-brand-soft:rgba(111,207,159,.15);--rh-accent:#f0b24a;--rh-on-accent:#1b2f26;--rh-accent-soft:#3a2c14;
--rh-solid:#24392f;--rh-ok:#4ade80;--rh-warn:#fbbf24;--rh-err:#f87171;--rh-info:#7cb6f0;--rh-overlay:rgba(0,0,0,.6);--rh-shadow:0 14px 34px -18px rgba(0,0,0,.8);color-scheme:dark}
html,body{margin:0;padding:0;overflow:hidden;background:transparent}
/* ---- pele Robin Hood ---- */
:focus-visible{outline:3px solid var(--rh-accent);outline-offset:2px}
@media(pointer:coarse){button,.btn,[role=button]{min-height:44px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}

</style></head>
<body>
<script>
// Moldura de UM banner Adsterra 468x60. A chave vem em ?k=<32 hex>. Carregada por <iframe src="/ad.html?k=..."> (URL real do seu
// domínio, em vez de srcdoc/about:srcdoc, que o Adsterra não consegue associar ao site aprovado e por isso não mostrava anúncio).
(function () {
  var m = /[?&]k=([0-9a-f]{32})(?:&|$)/i.exec(location.search); if (!m) return;
  var k = m[1];
  window.atOptions = { key: k, format: 'iframe', height: 60, width: 468, params: {} };
  document.write('<scr' + 'ipt src="https://www.highrevenueformat.com/' + k + '/invoke.js"></scr' + 'ipt>');
})();
</script>
</body></html>
